name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy src

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # Use `coverage run -m pytest` so coverage starts before the pytest plugin
      # entry point imports the package (otherwise the package counts as
      # "imported but not measured" and reports artificially low).
      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage report
      - name: Enforce coverage on core modules
        run: >
          coverage report --fail-under=90
          --include="*/retrieval_diff/diff.py,*/retrieval_diff/attribution.py,*/retrieval_diff/budget.py,*/retrieval_diff/lockfile.py"

  adapters:
    name: Backend adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The `test` matrix deliberately installs no optional extras, so the
      # adapter suites skip there. This job installs the backends so their
      # real query paths are actually exercised. Every one of them runs
      # in-process (FAISS index, Chroma ephemeral client, Qdrant `:memory:`)
      # -- no service containers, no network.
      - name: Install with adapter extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,faiss,chroma,qdrant]"
      - name: Run adapter tests
        run: >
          pytest -q
          tests/test_faiss_adapter.py
          tests/test_chroma_adapter.py
          tests/test_qdrant_adapter.py
